/**
 * 顶部日期时间组件
 */
var HeaderComponent = React.createClass({
	render:function(){
		var wrapStyle = {

		}
		var season = this.props.day/365;
		if(season < 0.25){
			season = '春';
		}else if(season >= 0.25 && season < 0.5){
			season = '夏';
		}else if(season >= 0.5 && season < 0.75){
			season = '秋';
		}else{
			season = '冬';
		}

		var time = '早晨';
		var headerStyle = {
			fontSize:'18px',
			textAlign:'center',
			fontWeight:'normal',
			height:'45px',
			lineHeight:'45px',
			margin:0,
			borderBottom:'1px solid '+lineColor
		}

		var colorBox = {
			display:'inline-block',
			height:'30px',
			width:'30px',
			background:'#eee',
			boxShadow: lineColor+' 0px 0px 1px',
			marginBottom: '-9px'
		}

		return (
			<div>
				<h2 style={headerStyle}>{season}-第{this.props.day}天-{time} <span style={colorBox}></span></h2>
			</div>
		)
	}
});

/**
 * 顶部组件
 */
var FooterComponent = React.createClass({
	getInitialState() {
	    return {
	        left:'0px',
	        transition:normalTransition
	    };
	},
	toLeft:function(){
		this.setState({
			left:'320px',
			transition:normalTransition
		});
		var next;
		switch(this.props.footerFlag){
			case 'bag':
				next = 'equip';
				break;
			case 'equip':
				next = 'skill';
				break;
			case 'skill':
				next = 'bag';
				break;
		}
		setTimeout(function(){
			this.props.setFlag(next);
			this.setState({
				left:'0px',
				transition:'none'
			})
		}.bind(this),300);
	},
	toRight:function(){
		this.setState({
			left:'-320px',
			transition:normalTransition
		});
		var next;
		switch(this.props.footerFlag){
			case 'bag':
				next = 'skill';
				break;
			case 'equip':
				next = 'bag';
				break;
			case 'skill':
				next = 'equip';
				break;
		}
		setTimeout(function(){
			this.props.setFlag(next);
			this.setState({
				left:'0px',
				transition:'none'
			})
		}.bind(this),300);
	},
	render:function(){
		var wrapStyle = {
			position:'absolute',
			bottom:0,
			width:'100%',
			left:this.state.left,
			transition:this.state.transition
		}
		var bag = (
			<FooterBagComponnent 
				items={this.props.items}
				footerOnClick={this.props.footerOnClick}
				spread={this.props.spread}
				toLeft={this.toLeft}
				toRight={this.toRight}
				footerFlag={this.props.footerFlag}>
			</FooterBagComponnent>
		);
		var equip = (
			<FooterEquipComponent 
				items={this.props.items}
				footerOnClick={this.props.footerOnClick}
				spread={this.props.spread}
				toLeft={this.toLeft}
				toRight={this.toRight}
				footerFlag={this.props.footerFlag}>
			</FooterEquipComponent>
		);
		var skill = (
			<FooterSkillComponent 
				items={this.props.items}
				spread={this.props.spread}
				toLeft={this.toLeft}
				toRight={this.toRight}
				footerFlag={this.props.footerFlag}>
			</FooterSkillComponent>
		)
		var result;
		switch(this.props.footerFlag){
			case 'bag':
				result = (<div style={wrapStyle}>{equip}{bag}{skill}</div>);
				break;
			case 'equip':
				result = (<div style={wrapStyle}>{skill}{equip}{bag}</div>);
				break;
			case 'skill':
				result = (<div style={wrapStyle}>{bag}{skill}{equip}</div>);
				break;
		}
		return result;
	}
});

/**
 * 物品列表复用组件
 */
var ItemsComponent = React.createClass({
	render:function(){
		var height = this.props.height || (parseInt(this.props.items.length / this.props.rowCount) + 1) * 40;
		var width = this.props.width || this.props.rowCount * 41 + 1;
		var itemHolderStyle = {
			margin:'0 auto',
			position:'relative',
			height:height + 'px',
			overflow:'hidden',
			width:width + 'px',
			transition:normalTransition,
		}
		var nameStyle = {
			margin:0,
			textAlign:'center',
			fontSize:'12px',
			fontWeight:'normal'
		}
		var countStyle = {
			width:'100%',
			fontSize:'12px',
			textAlign:'center',
			display: 'inline-block'
		}
		var items = this.props.items.map(function(item,index){
			var itemStyle = {
				width:'40px',
				height:'38px',
				border:'1px solid '+lineColor,
				position:'absolute',
				top:parseInt(index/this.props.rowCount) * 40 + 'px',
				left:index % this.props.rowCount * 41 + 'px'
			}
			if(index + 1 > this.props.rowCount){
				itemStyle.borderTop = 'none';
			}else{
				itemStyle.borderTop = '1px solid '+lineColor;
			}
			if((index+1) % this.props.rowCount != 0 && index != this.props.items.length - 1){
				itemStyle.borderRight = 'none';
			}else{
				itemStyle.borderRight = '1px solid '+lineColor;
			}
			if(item){
				var progress;
				if(item.progress){
					var progressStyle = {
						width:item.progress+'%',
						height:'5px',
						background:'#3c8dbc',
						margin: '0 4px',
						borderRadius: '5px',
					}
					progress = <div style={progressStyle}></div>;
				}
				return (
					<div style={itemStyle}>
						<h5 style={nameStyle}>{item.name}</h5>
						<span style={countStyle}>{item.count}</span>
						{progress}
					</div>
				)
			}else{
				return (
					<div style={itemStyle}></div>
				)
			}
			
		}.bind(this));

		return (
			<div style={itemHolderStyle}>
				{items}
			</div>
		)
	}
})

			height:'568px',
			border:'1px solid '+lineColor,
			fontFamily:'微软雅黑',
			position:'absolute',
			overflow:'hidden'
		}
		return (
			<div id="main" style={mainStyle}>
				<HeaderComponent day={200} time={8}></HeaderComponent>
				<ContentComponent contentClick={this.footerClose} spread={this.state.footerSpread}></ContentComponent>
				<FooterComponent footerFlag={this.state.footerFlag} setFlag={this.setFlag} items={this.state.items} spread={this.state.footerSpread} footerOnClick={this.footerOpen}></FooterComponent>
			</div>
		)
	},
})

React.render(
	<Main></Main>,
	document.getElementById("main")
)
</script>
</html>
